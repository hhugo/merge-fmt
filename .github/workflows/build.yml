name: build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - "5.5"
        include:
          # The lower bound, on Linux only.
          - os: ubuntu-latest
            ocaml-compiler: "4.14"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # The jj tests are skipped when jj is not installed.
      - name: Install jj
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj

      # The refmt tests are skipped when refmt is not installed.
      - name: Install refmt
        if: runner.os != 'Windows'
        run: opam install reason

      - run: opam install . --with-test

      - run: opam exec -- make all

      - run: opam exec -- make test

      - run: opam exec -- git diff --exit-code

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml 5.x
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - uses: ocaml/setup-ocaml/lint-fmt@v3
